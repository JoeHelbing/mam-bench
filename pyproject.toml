[project]
name = "mam-bench"
version = "2.0.0"
description = "Evaluate model-controlled agents in multi-agent simulations"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pydantic-ai-harness[coder,modal]>=0.57,<0.58",
    "pydantic-ai-slim[anthropic,openai]>=2.57,<2.58",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "mam_bench"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pyright]
include = ["src", "tests", "main.py"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
