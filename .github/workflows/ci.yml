name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  checks:
    name: Tests, Ruff, Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.3
          enable-cache: true
      - run: uv python install 3.14.7
      - run: uv sync --frozen --no-dev
      - name: Tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Ruff
        run: uvx --from ruff==0.17.3 ruff check src tests main.py && uvx --from ruff==0.17.3 ruff format --check src tests main.py
      - name: Pyright
        run: npx --yes pyright@1.1.414 --pythonpath .venv/bin/python

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'if (!/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z0-9][a-z0-9-]*\))?!?: .+/.test(process.env.PR_TITLE)) { console.error("Use a Conventional Commit PR title, e.g. feat: add a case"); process.exit(1); }'
