simulations:
- civil-violence-citizens-v1
civil_violence_citizens:
  board_size: 12
  citizen_density: 0.7
  police_density: 0.03
  citizen_vision: 3
  police_vision: 3
  threshold: 1.0
  private_preference_mean: 0.0
  private_preference_std: 1.0
  max_jail_term: 10
  seed_id: 50
  max_transitions: 60
  controlled_agent_count: 2
models:
- id: meta-muse-spark-1-3-contributor
  runtime: openrouter
  model: meta/muse-spark-1.3-contributor
  provider: meta
  settings:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    reasoning_effort: medium
    max_completion_tokens: 32768
    concurrency: 16
    use_sampling_seed: false
    tool_choice: auto
    timeout_seconds: 3600.0
    context_window_tokens: 1048576
    compaction_trigger_fraction: 0.7
    compaction_tail_tokens: 40000
    summary_completion_tokens: 16000
    memory_injection_tokens: 4000
log_level: DEBUG
output_directory: results/civil-violence-citizens
