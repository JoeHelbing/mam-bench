[project]
name = "mam-bench"
version = "0.1.0"
description = "Run reproducible multi-agent model benchmarks with validated evidence"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.36.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["mam_bench", "mam_bench_analysis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pyright]
include = ["src", "tests", "main.py"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
