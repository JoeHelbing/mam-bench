[project]
name = "mam-bench"
version = "0.2.0"
description = "Evaluate model-controlled agents in multi-agent simulations"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pydantic>=2.13.5",
    "pydantic-ai-harness>=0.29,<0.30",
    "pydantic-ai-slim[openai]>=2.38.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mam_bench"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pyright]
include = ["src", "tests", "main.py"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
