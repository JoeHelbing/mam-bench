# Provider example; invoking the CLI makes real model requests.
runtime: openrouter
model: qwen/qwen3.5-9b
provider: venice
settings:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  reasoning_effort: medium
  max_completion_tokens: 32768
  concurrency: 16
  use_sampling_seed: false
  tool_choice: required
  timeout_seconds: 3600.0
  context_window_tokens: 256000
  compaction_trigger_fraction: 0.7
  compaction_tail_tokens: 40000
  summary_completion_tokens: 16000
  memory_injection_tokens: 4000
